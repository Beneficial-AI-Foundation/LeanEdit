name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proofs:
    # EditorLean is a native macOS text editor for Apple silicon, so macos-14 is
    # the only supported target. The full application build (build.py) needs a
    # Tcl/Tk 9 runtime bundle, which is an external dependency that is not — and
    # should not be — shipped in CI, so this job runs the part of the project
    # that needs only the Lean toolchain: the proof checker. It compiles the
    # editor sources and audits the 21 universal theorems, failing on any axiom
    # outside propext / Classical.choice / Quot.sound (which rules out `sorry`
    # and `native_decide`).
    name: proofs + axiom audit (macos-arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache the Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('editor_lean/lean-toolchain') }}

      # EditorLean has no Lake project (its build is driven by build.py), so the
      # toolchain is installed directly with elan rather than through
      # leanprover/lean-action, which drives `lake`.
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install the pinned toolchain
        run: elan toolchain install "$(cat editor_lean/lean-toolchain)"

      - name: Check proofs and audit axioms
        run: python3 editor_lean/check_proofs.py
