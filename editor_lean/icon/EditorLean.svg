    <line x1="340" y1="400" x2="660" y2="400"/>
    <line x1="340" y1="470" x2="620" y2="470"/>
  </g>
  <path d="M408 560 L452 560 L590 770 L548 770 L496 690 L436 770 L392 770 L474 656 Z"
