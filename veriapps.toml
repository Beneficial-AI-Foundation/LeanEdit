# Release recipe for EditorLean.
#
# VeriLib certifies the tagged commit, then builds and signs the release on its
# own machines; nothing is built on GitHub. VeriStore lists the app and links the
# signed downloads. Every input is pinned: the Lean version by
# editor_lean/lean-toolchain, the build environment by the base image digest
# and the SHA-256 of each source archive below.
schema = 1

[app]
name = "EditorLean"
language = "lean"
lean_project = "editor_lean"   # Lake project that VeriLib atomizes and certifies

[build]
platforms = ["linux-x86_64"]

[build.linux-x86_64]
dockerfile = "Dockerfile"
target = "toolchain"           # Lean + Tcl/Tk only; no EditorLean source inside
workdir = "/src"               # the checkout is copied here (without .git)
# Proofs must check and reproduce the committed record exactly.
check = "cp editor_lean/verification.json /tmp/recorded.json && EDITORLEAN_LEAN=/opt/lean/bin/lean python3 editor_lean/check_proofs.py && cmp /tmp/recorded.json editor_lean/verification.json"
# Builds dist/EditorLean and runs the native self-tests.
command = "python3 editor_lean/build.py --toolchain /opt/lean --tk-bundle /opt/tcltk"
artifact = "dist/EditorLean"   # packed as EditorLean-<version>-linux-x86_64.tar.gz by VeriLib
binary = "bin/EditorLean"      # main executable inside the artifact

[build.linux-x86_64.args]
BASE_IMAGE = "debian:12@sha256:1d04200c2ece1d4d75a2a6f8e11ebce7d86a2ae28b34bb2c9cbb3ee9f4953e75"
LEAN_URL = "https://github.com/leanprover/lean4/releases/download/v4.35.0-rc3/lean-4.35.0-rc3-linux.tar.zst"
LEAN_SHA256 = "1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997"
TCL_URL = "https://prdownloads.sourceforge.net/tcl/tcl9.0.4-src.tar.gz"
TCL_SHA256 = "d0aed49230bc02a65c1e0229e65f34590a4b037ec40d546f32573b467f7551ea"
TK_URL = "https://prdownloads.sourceforge.net/tcl/tk9.0.4-src.tar.gz"
TK_SHA256 = "d7a146d2917eb8b5cc95276dbf0e3d03c7464d2b19c1675357857c989301dbb4"
